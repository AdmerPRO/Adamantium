name: Portable Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Windows x64 linker
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build portable package
        shell: powershell
        run: ./scripts/package-windows.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: adamantium-windows-x86_64
          path: dist/adamantium-windows-x86_64.zip
          if-no-files-found: error
