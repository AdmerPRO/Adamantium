name: Linux CLI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-cli:
    name: Test CLI (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm

      - name: Verify Linux x86-64 host
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          test "$(rustc --version --verbose | sed -n 's/^host: //p')" = "x86_64-unknown-linux-gnu"
          test "$(uname -m)" = "x86_64"

      - name: Install Adamantium CLI
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/adamantium-cli"
          cargo install --path . --locked --force --root "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Test installed CLI
        shell: bash
        run: bash scripts/test-cli-linux.sh
