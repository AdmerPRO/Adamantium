name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test-build:
    name: Check, test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check compilation
        run: cargo check --locked --all-targets --all-features

      - name: Check runtime formatting
        run: cargo fmt --manifest-path runtime/Cargo.toml --check

      - name: Check runtime compilation
        run: cargo check --manifest-path runtime/Cargo.toml --locked --all-targets

      - name: Install Typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos@1.49.0

      - name: Check spelling
        run: typos .

      - name: Lint Rust code
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Lint runtime code
        run: cargo clippy --manifest-path runtime/Cargo.toml --locked --all-targets -- -D warnings

      - name: Check compiler CLI
        run: cargo run --locked -- --help

      - name: Install NASM
        if: runner.os == 'Windows'
        run: choco install nasm --yes --no-progress

      - name: Configure Windows x64 linker
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Test generated Windows executables
        if: runner.os == 'Windows'
        run: cargo test --locked --test native -- --ignored

      - name: Build release
        run: cargo build --locked --release

      - name: Test installed CLI on Windows x86-64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustc --version --verbose
          if ((rustc --version --verbose) -notmatch 'host: x86_64-pc-windows-msvc') {
            throw 'The Windows CLI test must run on x86-64 MSVC.'
          }

          $installRoot = Join-Path $env:RUNNER_TEMP 'adamantium-cli'
          cargo install --path . --locked --force --root $installRoot
          $adamantium = Join-Path $installRoot 'bin/adamantium.exe'

          & $adamantium --version
          if ($LASTEXITCODE -ne 0) { throw 'adamantium --version failed.' }

          & $adamantium --help
          if ($LASTEXITCODE -ne 0) { throw 'adamantium --help failed.' }

          & $adamantium build example-project
          if ($LASTEXITCODE -ne 0) { throw 'adamantium build failed.' }

          & $adamantium run example-project
          if ($LASTEXITCODE -ne 0) { throw 'adamantium run failed.' }
